[project]
name = "network-weekly-backend"
description = "Network Weekly Report System backend (see SYSTEM_SPEC.md)"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    # Runtime stack fixed by SYSTEM_SPEC.md §25.
    "fastapi>=0.129",
    # ASGI server required to serve FastAPI in the web container.
    "uvicorn>=0.41",
    # Version caps below mirror SYSTEM_SPEC.md exactly (SQLAlchemy 2.x, psycopg 3, PySNMP 7.x).
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.17",
    "pysnmp>=7.1,<8",
    "netmiko>=4.6",
    "python-docx>=1.2",
    # Guarantees zoneinfo has Asia/Shanghai data even on minimal images.
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "application/backend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["application/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers -q"
markers = [
    "integration: requires a real PostgreSQL (dev compose) and runs Alembic migrations",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.14"
# `tests/integration` hosts the db_guard helper module imported by name.
mypy_path = "application:tests/integration"
files = ["application/backend", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
